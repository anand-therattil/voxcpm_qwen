# Proof-of-concept fine-tuning config: VoxCPM2 architecture with a Qwen2.5-0.5B
# text-semantic backbone (see src/voxcpm/model/voxcpm2_qwen.py), trained on
# Hindi + English only.
#
# The Hindi/English restriction is entirely a property of train_manifest /
# val_manifest below -- filter your manifest to hi/en examples before
# pointing this config at it. Nothing in the architecture enforces a
# language allowlist.
#
# Prerequisite: run scripts/init_voxcpm_qwen_poc.py to produce pretrained_path.

pretrained_path: /path/to/VoxCPM2-Qwen2.5-0.5B-poc/
train_manifest: /path/to/train_hi_en.jsonl
val_manifest: /path/to/val_hi_en.jsonl
sample_rate: 16000        # must match the reused AudioVAE's encoder input rate
out_sample_rate: 48000    # for TensorBoard audio logging

# Small batch / short run defaults for a PoC -- everything downstream of the
# Qwen backbone (residual LM, LocEnc, LocDiT, projections) is randomly
# initialized, so expect this to need real iteration (num_iters, data volume)
# before output is intelligible. These are starting points, not targets.
batch_size: 2
grad_accum_steps: 8       # effective batch size = batch_size x grad_accum_steps = 16
num_workers: 4
num_iters: 2000
log_interval: 10
valid_interval: 200
save_interval: 200
learning_rate: 0.00003
weight_decay: 0.01
warmup_steps: 100
max_steps: 2000
max_batch_tokens: 8192
max_grad_norm: 1.0
save_path: /path/to/checkpoints/voxcpm2_qwen_poc_hi_en
tensorboard: /path/to/logs/voxcpm2_qwen_poc_hi_en
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

# Recommended for a PoC: LoRA on the Qwen backbone (cheap, fast iteration)
# rather than full fine-tuning. Flip to a full-finetune run only once this
# looks promising and you have the compute budget for it.
lora:
  enable_lm: true     # applies to base_lm (Qwen) AND residual_lm -- see
                       # VoxCPM2Model._apply_lora; both use q/k/v/o_proj names
  enable_dit: true
  enable_proj: false
  r: 16
  alpha: 16
  dropout: 0.0
